name: "Documentation improvement"
description: "Report unclear, missing or incorrect documentation."
title: "[Docs]: "
body:
  - type: markdown
    attributes:
      value: "Help us make the documentation useful for both package consumers and contributors."
  - type: textarea
    id: location
    attributes:
      label: "Page or topic"
      description: "Link the affected page or identify the missing topic."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "What needs improving?"
      description: "Explain what is incorrect, unclear or missing and what you were trying to do."
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: "Suggested change"
      description: "Share proposed wording or an example if you have one."
    validations:
      required: false

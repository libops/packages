name: Review new release lines
on:
  schedule:
    - cron: '43 9,21 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: review-release-lines
  cancel-in-progress: false
jobs:
  review:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Require the selected Go toolchain
        run: echo 'GOTOOLCHAIN=local' >> "$GITHUB_ENV"
      - name: Create lbops-renovate installation token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIV_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Report new stable lines for setup
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: make review-lines REPORT=1

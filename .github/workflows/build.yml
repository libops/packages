name: Build package
on:
  workflow_call:
    inputs:
      validate-only:
        type: boolean
        default: false
      package:
        required: true
        type: string
      local-builder:
        type: boolean
        default: false
      contexts:
        type: string
        default: ''
      platforms:
        required: true
        type: string
    outputs:
      local-builder:
        value: ${{ inputs.local-builder }}
      contexts:
        value: ${{ inputs.contexts }}
      context:
        value: ${{ jobs.publish.outputs.context }}
    secrets:
      REGISTRY_USER:
        required: false
      REGISTRY_PASSWORD:
        required: false
permissions: {}
jobs:
  build:
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    env:
      VALIDATE_ONLY: ${{ inputs.validate-only && '1' || '' }}
      LOCAL_BUILDER: ${{ inputs.local-builder && '1' || '' }}
      TARGET: ${{ inputs.package }}
      CONTEXTS: ${{ inputs.contexts }}
      ARCH: ${{ matrix.arch }}
      PR: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ vars.repository || 'ghcr.io/libops' }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Require the selected Go toolchain
        run: echo 'GOTOOLCHAIN=local' >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # Additional registry authentication (e.g. GAR OIDC) can populate Docker's
      # credential helper here; shared Make commands use that configuration.
      - name: Build and publish before testing
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: make publish
      - name: Build and test fork contributions locally
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        env:
          CI: ''
          GITHUB_TOKEN: ''
          REGISTRY_USER: ''
          REGISTRY_PASSWORD: ''
        run: |
          make build
          make test
  publish:
    timeout-minutes: 15
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      context: ${{ steps.publish.outputs.context }}
    env:
      VALIDATE_ONLY: ${{ inputs.validate-only && '1' || '' }}
      LOCAL_BUILDER: ${{ inputs.local-builder && '1' || '' }}
      TARGET: ${{ inputs.package }}
      PR: ${{ github.event.pull_request.number }}
      REPOSITORY: ${{ vars.repository || 'ghcr.io/libops' }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Require the selected Go toolchain
        run: echo 'GOTOOLCHAIN=local' >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - id: publish
        name: Publish multi-architecture image
        run: make manifest
